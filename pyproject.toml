[project]
name = "afterburn-watch"
version = "0.1.0"
description = "Automated pipeline that turns Sentinel-2 imagery into burn-severity inputs for USGS post-fire debris-flow hazard models, so emergency managers can get an answer in hours instead of weeks."
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "TBD" }
authors = [
    { name = "Roberto Jones" },
    { name = "Troy Jenks" },
    { name = "Ashraf Md" },
]
keywords = ["wildfire", "debris-flow", "burn-severity", "dNBR", "hazard", "usgs", "sentinel-2"]

dependencies = [
    "pfdf>=3.0.4,<4",
    "pystac-client",
    "rasterio",
    "streamlit",
    "folium",
    "streamlit-folium",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
tutorials = ["pfdf[tutorials]>=3.0.4,<4", "jupyter"]

# NOTE: pfdf is NOT on PyPI. It ships from USGS's own GitLab package
# registry, so installing this project requires the extra index below:
#
#   pip install -e ".[dev,tutorials]" \
#     --extra-index-url https://code.usgs.gov/api/v4/groups/859/-/packages/pypi/simple
#
# See README.md "Getting started" and PROGRESS.md "Known issues".

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
